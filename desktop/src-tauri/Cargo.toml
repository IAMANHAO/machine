[package]
name = "mds-desktop"
version = "0.1.0"
description = "机械设计物料选型引擎"
authors = ["MDS"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
