    - {d_from: 230, d_to: 260, b: 56,  h: 32, t1: 20.0, t2: 12.4}
    - {d_from: 260, d_to: 290, b: 63,  h: 32, t1: 20.0, t2: 12.4}
    - {d_from: 290, d_to: 330, b: 70,  h: 36, t1: 22.0, t2: 14.4}
    - {d_from: 330, d_to: 380, b: 80,  h: 40, t1: 25.0, t2: 15.4}
    - {d_from: 380, d_to: 440, b: 90,  h: 45, t1: 28.0, t2: 17.4}
