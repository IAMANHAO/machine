# 键的长度系列 L（GB/T 1096-2003）
# 选键长的通行做法：取不大于轮毂长度的最大标准值。
length_series:
  series: [10, 12, 14, 16, 18, 20, 22, 25, 28, 32, 36, 40, 45, 50, 56, 63,
           70, 80, 90, 100, 110, 125, 140, 160, 180, 200, 220, 250, 280,
           320, 360, 400]
  note: "键长大于 500mm 时，为控制直线度，键长应小于 10 倍键宽"
