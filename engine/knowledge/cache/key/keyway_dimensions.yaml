# 平键键槽剖面尺寸（GB/T 1095-2003）
#
# 用法：按轴的公称直径 d 落进哪个区间，取该行的 b×h 与槽深。
#
# ── 区间是左开右闭 ──
# 标准写作「>30~38」，即 d_from < d ≤ d_to。
# 边界值归上一行：d = 30 取 b=8×h=7 那一行，不是 10×8。
# row_select 的两个条件（d_from < d 且 d_to >= d）就是照这个写的。
#
# t1 是轴槽深，t2 是毂槽深。注意 t1 + t2 > h —— 两者之间留有间隙，
# 平键靠**侧面**传力，顶面不接触，所以强度校核算的是侧面挤压。

by_shaft_diameter:
  rows:
    - {d_from: 6,   d_to: 8,   b: 2,   h: 2,  t1: 1.2,  t2: 1.0}
    - {d_from: 8,   d_to: 10,  b: 3,   h: 3,  t1: 1.8,  t2: 1.4}
    - {d_from: 10,  d_to: 12,  b: 4,   h: 4,  t1: 2.5,  t2: 1.8}
    - {d_from: 12,  d_to: 17,  b: 5,   h: 5,  t1: 3.0,  t2: 2.3}
    - {d_from: 17,  d_to: 22,  b: 6,   h: 6,  t1: 3.5,  t2: 2.8}
    - {d_from: 22,  d_to: 30,  b: 8,   h: 7,  t1: 4.0,  t2: 3.3}
    - {d_from: 30,  d_to: 38,  b: 10,  h: 8,  t1: 5.0,  t2: 3.3}
    - {d_from: 38,  d_to: 44,  b: 12,  h: 8,  t1: 5.0,  t2: 3.3}
    - {d_from: 44,  d_to: 50,  b: 14,  h: 9,  t1: 5.5,  t2: 3.8}
    - {d_from: 50,  d_to: 58,  b: 16,  h: 10, t1: 6.0,  t2: 4.3}
    - {d_from: 58,  d_to: 65,  b: 18,  h: 11, t1: 7.0,  t2: 4.4}
    - {d_from: 65,  d_to: 75,  b: 20,  h: 12, t1: 7.5,  t2: 4.9}
    - {d_from: 75,  d_to: 85,  b: 22,  h: 14, t1: 9.0,  t2: 5.4}
    - {d_from: 85,  d_to: 95,  b: 25,  h: 14, t1: 9.0,  t2: 5.4}
    - {d_from: 95,  d_to: 110, b: 28,  h: 16, t1: 10.0, t2: 6.4}
    - {d_from: 110, d_to: 130, b: 32,  h: 18, t1: 11.0, t2: 7.4}
    - {d_from: 130, d_to: 150, b: 36,  h: 20, t1: 12.0, t2: 8.4}
    - {d_from: 150, d_to: 170, b: 40,  h: 22, t1: 13.0, t2: 9.4}
    - {d_from: 170, d_to: 200, b: 45,  h: 25, t1: 15.0, t2: 10.4}
