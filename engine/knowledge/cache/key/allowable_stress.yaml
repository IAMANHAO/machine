# 键连接的许用挤压应力 [σp]（静连接）
#
# ── 取三者中最弱的那个材料 ──
#
# 键、轴、轮毂三者材料可能不同，[σp] **必须取最弱的那一个**。
# 典型场合是钢轴 + 铸铁齿轮：键和轴都是钢，但轮毂是铸铁，
# 那就得按铸铁查（50~60 而不是 100~120），差了一倍。
# 选错这一项，校核会轻松通过，而实际轮毂会被压溃。
#
# ── 为什么工作流取区间下端 ──
#
# 每格给的是区间。本工作流一律取**下端**（偏安全）。
# 需要用上端的场合（载荷十分平稳、材料性能有保证），
# 应当由设计者自行判断并记录依据，而不是让软件默认给你。

static_connection:
  steel:
    name_zh: 钢（键 / 轴 / 轮毂中最弱者为钢）
    static:
      name_zh: 静载荷
      min: 125
      max: 150
    light_impact:
      name_zh: 轻微冲击
      min: 100
      max: 120
    impact:
      name_zh: 冲击载荷
      min: 60
      max: 90
  cast_iron:
    name_zh: 铸铁（最弱者为铸铁轮毂）
    static:
      name_zh: 静载荷
      min: 70
      max: 80
    light_impact:
      name_zh: 轻微冲击
      min: 50
      max: 60
    impact:
      name_zh: 冲击载荷
      min: 30
      max: 45

# 动连接（导向平键 / 滑键）用许用压强 [p]，单位同为 MPa，但口径不同，
# 不能与上表混用。本工作流不覆盖动连接，这段仅供查阅。
sliding_connection_reference:
  steel: {static: 50, light_impact: 40, impact: 30}
  note: "动连接还要校核磨损，仅有压强一项不够；需要时应另建工作流"
