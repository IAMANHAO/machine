# O 形橡胶密封圈
#
# ── 截面直径系列 ──
# GB/T 3452.1 的 d2 系列只有 5 个值。O 圈的规格写作 d1 × d2
# （内径 × 截面直径），两者都要给才能下单。
#
# ── 压缩率与填充率 ──
#
#   压缩率 = (d2 − h) / d2 × 100%      h 为沟槽深度
#   填充率 = O 圈截面积 / 沟槽截面积
#
# 两者都是**纯算术**，由沟槽尺寸与 d2 直接得出，引擎可以算。
# 但**合格判据在 GB/T 3452.3 里，没有录入**，所以引擎只报数不判定——
# 凭印象设一个阈值，等于编了一条判据。

section_series:
  series: [1.8, 2.65, 3.55, 5.3, 7.0]
  note: "GB/T 3452.1 的截面直径 d2 系列，只有这 5 档"

# 材料温度范围 —— 取两处信源的保守交集，原值见 _todo
materials:
  nbr:
    name_zh: 丁腈橡胶 NBR（最常用）
    temp_min: -25
    temp_max: 100
    media: 液压油、矿物油、水、一般润滑脂
    avoid: 极性溶剂、酮类、酯类、强氧化剂、磷酸酯液压液
  fkm:
    name_zh: 氟橡胶 FKM（耐高温耐化学）
    temp_min: -20
    temp_max: 250
    media: 大部分油与溶剂、酸、燃油、高温工况
    avoid: 低温工况、酮类、胺类、热水蒸汽
  epdm:
    name_zh: 三元乙丙橡胶 EPDM
    temp_min: -50
    temp_max: 150
    media: 水、水蒸汽、制动液、磷酸酯液压液、弱酸碱
    avoid: 矿物油与润滑脂（会溶胀）
  vmq:
    name_zh: 硅橡胶 VMQ
    temp_min: -60
    temp_max: 200
    media: 静密封、宽温域、食品与医药场合
    avoid: 动密封（耐磨性差）、水蒸汽、高压

# 压缩率与填充率的合格判据在 GB/T 3452.3-2005 中给出，
# 本表**刻意不填**。需要判定时请查标准原文或厂商设计手册。
compression_limits: {}
fill_ratio_limits: {}
