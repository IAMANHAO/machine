# 圆柱螺旋压缩弹簧 —— 设计系数
#
# ── 这张表刻意很小 ──
#
# 弹簧设计要用到的数里，多数是**查得到出处才敢写**的：
#   · 许用切应力比    —— 只有 III 类拿到了带算例的确认，I / II 类留空
#   · 钢丝直径系列    —— 检索不到可核对的数值，不录，改由用户填实际钢丝直径
#   · 切变模量 G      —— 同上，改为必填输入，从材料证书抄
#   · 稳定性临界 b    —— 单一信源，已录
#
# 结果是这个工作流"算"的部分很扎实（曲度系数、强度、刚度、圈数都是定义式），
# "查"的部分很少。这是数据现状决定的，不是设计取巧。

# ── 载荷类别 ──
# 按弹簧在整个寿命期内的**循环次数**分类，不是按载荷大小。
#   I  类：> 10⁶ 次          —— 长期反复工作，如发动机气门弹簧
#   II 类：10³ ~ 10⁶ 次      —— 一般机械用弹簧
#   III类：< 10³ 次          —— 基本静载，如安全阀、夹具压紧
#
# [τ] = tau_ratio × σb，σb 是钢丝的抗拉强度（按钢丝直径与材料等级查材料标准，
# 或直接从供货材质证明书上抄——后者更可靠）。
ratio_by_class:
  class_1:
    name_zh: I 类（循环 > 10⁶ 次，如气门弹簧）
    # tau_ratio 未录入：常被引作 0.3，但没检索到可核对的出处
  class_2:
    name_zh: II 类（循环 10³ ~ 10⁶ 次，一般机械）
    # tau_ratio 未录入：常被引作 0.4，同上
  class_3:
    name_zh: III 类（循环 < 10³ 次，基本静载）
    tau_ratio: 0.5
    note: "算例复核：C 级碳素弹簧钢丝 σb = 1660 MPa → [τ] = 830 MPa"

# ── 稳定性临界高径比 ──
# 压缩弹簧太"高"会像细长杆一样失稳侧弯。判据是 b = H0 / D2。
# 端部约束越强，允许的 b 越大。
stability_limits:
  both_fixed:
    name_zh: 两端固定
    b_limit: 5.3
  one_fixed_one_free:
    name_zh: 一端固定、一端回转
    b_limit: 3.7
  both_free:
    name_zh: 两端回转
    b_limit: 2.6
  note: "超限时的对策是加导杆或导套，而不是硬改弹簧参数"
