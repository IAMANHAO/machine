# 渐开线圆柱齿轮 —— 基本齿廓参数与弹性系数
#
# ── 这张表为什么这么小 ──
#
# GB/T 3480 的承载能力计算要十几个系数，其中 ZH、YFa、YSa、σHlim
# **在标准里是以线图给出的**，读不出可核对的数值。
#
# 所以这个物料的边界划在：
#   ✅ 几何计算  —— 分度圆、齿顶圆、齿根圆、中心距、重合度、变位，全是定义式，全做
#   ⚠ 接触应力  —— 公式是确定的，但 ZH 与许用应力由**用户按线图查好后填入**
#   ❌ 完整强度校核 —— 不做，也不假装做
#
# 这不是完整的 GB/T 3480 计算。文档里写死了这句话。

# 标准基本齿条齿廓（GB/T 1356）—— 这三个是标准的定义值
basic_rack:
  alpha_n: 20
  ha_star: 1.0
  c_star: 0.25
  note: "法向压力角 20°、齿顶高系数 1、顶隙系数 0.25。非标齿廓不适用本工作流"

# 弹性系数 ZE（GB/T 3480）—— 计入配对材料弹性模量与泊松比的影响
elastic_factor:
  steel_steel:
    name_zh: 钢 — 钢
    ZE: 189.8
  note: "只录了钢-钢配对。钢-铸铁、钢-球铁等其它配对未录，选到会如实报缺口"

# 以下几项在 GB/T 3480 中以**线图**给出，读不出可核对的数值，一律留空。
# 需要时由用户按线图查好后作为输入填入。
node_region_factor_ZH: {}
tooth_form_factor_YFa: {}
fatigue_limits: {}
