# 联轴器选型系数
#
# ── 计算转矩 ──
#
#   T  = 9550 P / n          理论转矩（N·m，P 单位 kW）
#   Tc = Kw · K工作机 · T     计算转矩
#   选型准则：样本公称转矩 Tn ≥ Tc
#
# 两个系数分工不同，别混为一谈：
#   Kw     —— 动力机系数，反映**驱动端**的转矩波动特性（缸数越少波动越大）
#   K工作机 —— 工况系数，反映**负载端**的冲击、正反转、制动、频繁启动
#
# 只有 Kw 有可核对的出处，录在下面。K工作机 改为用户输入——
# 各厂商样本口径不一致，用哪张表应当跟着你选的那个样本走。

prime_movers:
  class_1:
    name_zh: I 类 —— 电动机、汽轮机
    Kw: 1.0
  class_2:
    name_zh: II 类 —— 四缸及以上内燃机
    Kw: 1.2
  class_3:
    name_zh: III 类 —— 双缸内燃机
    Kw: 1.4
  class_4:
    name_zh: IV 类 —— 单缸内燃机
    Kw: 1.6

# 联轴器传动效率（供传动装置总效率计算参考，本工作流不直接使用）
# 来源：《机械设计基础》表 3-1
efficiency:
  elastic: {name_zh: 弹性联轴器, eta_min: 0.99, eta_max: 0.995}
  gear_type: {name_zh: 齿式联轴器, eta: 0.99}
  oldham: {name_zh: 十字滑块联轴器, eta_min: 0.97, eta_max: 0.99}
