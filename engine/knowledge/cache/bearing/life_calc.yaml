# 滚动轴承 基本额定寿命计算
#
# ── 引擎在这里只做两件确定的事 ──
#
#   当量动载荷   P = fp · (X·Fr + Y·Fa)
#   基本额定寿命 L10h = (10⁶ / (60 n)) · (C / P)^ε
#
# C（基本额定动载荷）、C0（基本额定静载荷）、X、Y 全部来自**轴承样本**，由用户填。
# 这不是偷懒：样本上这几个数印在同一页，抄它们比抄一张来路不明的系数表可靠得多，
# 而且不同厂商同一型号的 C 值确实有差异——自建型号库反而会给出错的数。
#
# ── 寿命指数 ε ──
# 由滚动体与滚道的接触形式决定，是 ISO 281 的定义值，不是经验系数：
#   球轴承   点接触  ε = 3
#   滚子轴承 线接触  ε = 10/3 ≈ 3.333
# 指数越大，提高 C/P 带来的寿命收益越显著。

exponents:
  ball:
    name_zh: 球轴承（点接触）
    epsilon: 3
  roller:
    name_zh: 滚子轴承（线接触）
    epsilon: 3.3333333333
    note: "严格值为 10/3"

# 纯径向载荷（Fa = 0，或 Fa/Fr ≤ e）时的系数是**定义性的**，不需要查表：
#   X = 1，Y = 0  ⟹  P = fp · Fr
# 这一档因此可以直接算。联合载荷必须从样本抄 X、Y。
pure_radial:
  X: 1
  Y: 0
  note: "Fa = 0 或 Fa/Fr ≤ e 时适用。e 值同样要查样本——引擎不替你判断是否满足"
