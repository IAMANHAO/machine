    - "Mobil Mobilux EP 0"
    - "Klüber Klüberlub BE 41-1501"
    - "Shell Gadus S2 V220 0"
  半流体脂_NLGI_00:
    - "Mobil Mobilgear OGT 220"
    - "Shell Gadus S5 V220 00"
    - "Klüber Klüberfluid NH 11-461"
  闭式齿轮油_CLP:
