# ISO VG → SAE J300 大致对应（仅常温矿物油）
ISO_to_SAE_approx:
  VG_22: "≈ SAE 5W"
  VG_32: "≈ SAE 10W"
  VG_46: "≈ SAE 15W-20"
  VG_68: "≈ SAE 20"
  VG_100: "≈ SAE 30"
  VG_150: "≈ SAE 40"
  VG_220: "≈ SAE 50"
  VG_320: "≈ SAE 60"
  notes: "ISO VG 和 SAE J300 体系不同，SAE 含低温冷启动指标；不能用 ISO VG 直接代换 SAE 用于发动机油"

# 温度-黏度估算（Walther 方程近似）
# 仅用于跨温度黏度估算
temperature_viscosity:
  rule_of_thumb: "油温每升 10 deg C，黏度衰减约 10~15 %（矿物油）"
  example:
    VG_100_at_40: 100
    VG_100_at_50: 87
    VG_100_at_60: 76
    VG_100_at_70: 66
    VG_100_at_80: 58
    VG_100_at_90: 51
    VG_100_at_100: 45
  note: "实际换算请用 ASTM D341 或厂商 PD；以上为常压矿物油粗估"