# 轴的许用扭转切应力 [τT]
#
# ── 为什么这张表里没有 A0 ──
#
# 手册通常同时给 [τT] 和一个系数 A0，用 d ≥ A0·(P/n)^(1/3) 估算轴径。
# 但 A0 不是独立数据，它是 [τT] 的**换算结果**：
#
#     τT = T / WT = 9.55×10⁶ · P/n / (0.2 d³) ≤ [τT]
#     ⟹  d ≥ ( 9.55×10⁶ · P / (0.2 · [τT] · n) )^(1/3)
#     ⟹  A0 = ( 9.55×10⁶ / (0.2 · [τT]) )^(1/3)
#
# 手册列 A0 是为了让人少按几次计算器。软件没有这个需要，
# 多存一个可推导的系数只会多一处可能抄错、也多一个读者无从追溯的数字。
# 所以本表只存 [τT]，工作流直接用上面第二式算 d。
# tests/test_shaft.py 会验证两种写法给出同一个结果。
#
# ── 区间两端怎么取 ──
#
# [τT] 是**已经考虑了弯曲影响而降低**的许用扭转切应力，所以区间很宽：
#   弯矩很小 / 只受转矩、载荷平稳、单向回转  → 取 tau_high（轴细）
#   弯矩较大 / 载荷有冲击 / 双向回转          → 取 tau_low（轴粗）
# 这是设计判断，由用户在输入里选，引擎不替你定。

materials:
  q235_20:
    name_zh: Q235A、20 钢
    tau_low: 12
    tau_high: 20
    note: "两处信源分别为 15~25 与 12~20，本表取保守端"
  steel_35:
    name_zh: 35 钢
    tau_low: 20
    tau_high: 30
    note: "两处信源分别为 20~35 与 20~30，本表取保守端"
  steel_45:
    name_zh: 45 钢（最常用）
    tau_low: 30
    tau_high: 40
    note: "**单一信源**。另一处转载的 45 钢行数值疑似与 1Cr18Ni9Ti 行错位，未采用"
  alloy_40cr:
    name_zh: 40Cr、35SiMn、38SiMnMo、42SiMn、40MnB、3Cr13
    tau_low: 35
    tau_high: 52
    note: "两处信源分别为 35~55 与 40~52，本表取保守端"
  stainless_1cr18ni9ti:
    name_zh: 1Cr18Ni9Ti（奥氏体不锈钢）
    tau_low: 15
    tau_high: 25

# 截面有键槽时轴径要放大——键槽削弱了抗扭截面
# 来源：同上两处信源（"键槽使 A 值增大 4~10%，按数量定"）
# 本表取各自区间的上端，偏安全。
keyway_allowance:
  none: {factor: 1.00, name_zh: 无键槽}
  one: {factor: 1.05, name_zh: 单键槽（放大 5%）}
  two: {factor: 1.10, name_zh: 双键槽（放大 10%）}
