# 滚子链 链号与节距
#
# ── 为什么这张表只有节距一列 ──
#
# 节距是**可以独立复算**的：链号的前两位是节距的 1/16 英寸数。
#
#     p = 前两位 ÷ 16 × 25.4   (mm)
#
#   08B → 8/16 in  = 0.500 in = 12.700 mm
#   10B → 10/16 in = 0.625 in = 15.875 mm
#   12B → 12/16 in = 0.750 in = 19.050 mm
#   16B → 16/16 in = 1.000 in = 25.400 mm
#   20B → 20/16 in = 1.250 in = 31.750 mm
#
# 其余参数（滚子直径、排距、内宽、极限拉伸载荷）检索到的转载**列与表头错位**，
# 数值不可信，宁可不录。tests/test_chain_seal_gear.py 会拿上面的式子逐行校验节距。
#
# A 系列源于美国，B 系列源于英国，两者节距相同但其余尺寸不同，不可混用。

chains:
  c05B:
    code: 05B
    pitch: 8.0
    series: B
    note: "**公制例外**：按公式应为 7.9375，标准取 8.0。唯一不满足复算式的一档"
  c06B:
    code: 06B
    pitch: 9.525
    series: B
  c08A:
    code: 08A
    pitch: 12.7
    series: A
  c08B:
    code: 08B
    pitch: 12.7
    series: B
  c10A:
    code: 10A
    pitch: 15.875
    series: A
  c10B:
    code: 10B
    pitch: 15.875
    series: B
  c12A:
    code: 12A
    pitch: 19.05
    series: A
  c12B:
    code: 12B
    pitch: 19.05
    series: B
  c16A:
