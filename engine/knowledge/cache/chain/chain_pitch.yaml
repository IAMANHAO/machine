    pitch: 25.4
    series: A
  c16B:
    code: 16B
    pitch: 25.4
    series: B
  c20A:
    code: 20A
    pitch: 31.75
    series: A
  c20B:
    code: 20B
    pitch: 31.75
    series: B
  c24A:
    code: 24A
