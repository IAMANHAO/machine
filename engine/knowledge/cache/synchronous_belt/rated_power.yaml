# 同步带（梯形齿）基准额定功率 P0（节距单位 mm）
# P0 对应基准带宽 bs0；实际带宽 bs 下的额定功率需按 1.14 次方修正
#   Pr = Kz × (bs / bs0)^1.14 × P0
# 选型目标：Pr ≥ Pd = K_A × P

# ---------- L 型（节距 9.525）示例 ----------
belt_type_L:
  # 表头：每个 sub-table 按 [n1, z1] → P0
  # 完整数据应来自 GB/T 11362-2021 表 5
  bs0: 25.4
  examples:
    # n1 = 1450 r/min
    - n1: 1450
      points:
        - z1: 18
          P0: 0.65
        - z1: 24
          P0: 0.86
        - z1: 30
          P0: 1.07
        - z1: 36
          P0: 1.28
    # n1 = 2880 r/min
    - n1: 2880
      points:
        - z1: 24
          P0: 1.20
        - z1: 30
          P0: 1.50
        - z1: 36
          P0: 1.80

# ---------- H 型（节距 12.7）示例 ----------
belt_type_H:
  bs0: 25.4
  examples:
    - n1: 1450
      points:
        - z1: 18
          P0: 1.60
        - z1: 24
          P0: 2.10
        - z1: 30
          P0: 2.60
    - n1: 2880
      points:
        - z1: 24
          P0: 3.40
        - z1: 30
          P0: 4.20

# ---------- XH 型（节距 22.225）示例 ----------
belt_type_XH:
  bs0: 76.2
  examples:
    - n1: 1450
      points:
        - z1: 24
          P0: 5.00
        - z1: 30
          P0: 6.20

# ---------- XL 型（节距 5.08）示例 ----------
belt_type_XL:
  bs0: 12.7
  examples:
    - n1: 1450
      points:
        - z1: 18
          P0: 0.22
        - z1: 24
          P0: 0.30

# ---------- XXH 型（节距 31.75）示例 ----------
belt_type_XXH:
  bs0: 101.6
  examples:
    - n1: 1450
      points:
        - z1: 24
          P0: 9.00

# 完整表录入规则
# 请把 GB/T 11362-2021 表 5（XL）、表 6（L）、表 7（H）、表 8（XH/XXH）按
#   belt_type_<TYPE>:
#     bs0: <mm>
#     rows:
#       - n1: <rpm>
#         points:
#           - z1: <teeth>
#             P0: <kW>
# 这种结构展开，便于 calc_engine 按 n1、z1 二维插值。
