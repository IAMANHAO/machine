# 圆整规则
# 1. 计算 L0（理论节线长）
# 2. 从对应带型的 series 中找最接近且 Lp ≥ L0 的值
# 3. 反算实际中心距：a = a0 + (Lp - L0) / 2
# 4. 实际齿数 z = Lp / pb，结果必须为整数，否则需重新圆整 Lp

# 齿数校验
teeth_check_formula: "z = Lp / pb"
teeth_check_note: "若非整数说明 Lp 与带型 pb 不匹配，需重新选取 Lp"
