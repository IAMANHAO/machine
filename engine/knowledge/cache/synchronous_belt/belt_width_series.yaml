# 同步带（梯形齿）标准带宽 bs 系列（每带型基准宽度 bs0 + 常用宽度序列）
# bs0：在额定功率 P0 中的基准带宽，按带型取值
# series：可选标准带宽（含基准值）

belt_width:
  XL:
    bs0: 12.7
    series: [3.2, 4.8, 6.4, 7.9, 9.5, 12.7, 15.9, 19.1, 22.2, 25.4, 38.1, 50.8]
  L:
    bs0: 25.4
    series: [12.7, 19.1, 25.4, 38.1, 50.8, 76.2, 101.6]
  H:
    bs0: 25.4
    series: [19.1, 25.4, 38.1, 50.8, 76.2, 101.6, 152.4]
  XH:
    bs0: 76.2
    series: [50.8, 76.2, 101.6, 152.4, 203.2, 254.0]
  XXH:
    bs0: 101.6
    series: [76.2, 101.6, 152.4, 203.2, 254.0, 304.8]

# 计算过程
# 1. 计算啮合齿数 zm = ent(0.5 - (d2-d1)/(6a)) × z1
# 2. 系数 Kz（zm ≥ 6 时 Kz=1，zm<6 时 Kz=1-0.2(6-zm)）
# 3. 查 P0（按带型 × n1 × z1 在 rated_power.yaml 中）
# 4. 计算所需最小带宽：
#    bs' ≥ bs0 × (Pd / (Kz × P0))^(1/1.14)
# 5. 在同带型 series 中选 bs ≥ bs' 的最近值
# 6. 校核：额定功率 Pr = Kz × (bs / bs0)^1.14 × P0 ≥ Pd
