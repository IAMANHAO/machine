# 普通螺纹（粗牙）基本尺寸与应力截面积
#
# 用法：按所需应力截面积 As 选最小满足的规格（row_select 步骤）。
#
# ── 本表每一列都可以独立复算，这是比"两处转载一致"更强的证据 ──
#
#   中径   d2 = d − 0.6495 × P
#   小径   d1 = d − 1.0825 × P          （内螺纹小径）
#   应力截面积  As = 0.7854 × (d − 0.9382 × P)²
#
# tests/test_bolt.py 会拿这三个式子逐行校验表值。改表之后如果测试红了，
# 先怀疑是抄错了，而不是去改测试的容差。
#
# ── 录入规则 ──
# As 取的是精度更高的那一处转载（保留 1 位小数）；另一处是 3 位有效数字的取整值，
# 两者在取整误差内一致。GB/T 16823.1 原表可能给的是取整值（如 M30 为 561）。

