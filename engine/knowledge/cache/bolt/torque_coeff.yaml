# 拧紧力矩系数 K
#
# 拧紧力矩  T = K · F0 · d        （T 单位 N·mm，F0 单位 N，d 单位 mm）
#
# ── 为什么给区间而不是单值 ──
#
# K 把螺纹副摩擦与支承面摩擦一起打包成一个经验系数。它随表面处理、
# 是否润滑、垫圈材质、拧紧速度变化，同一种表面处理在不同信源里能差近一倍。
# 给一个精确到小数点后两位的单值，是在用精度冒充准确。
#
# 所以每一项给的是 [K_min, K_max]，工作流据此输出一个**力矩区间**。
# 需要精确拧紧力矩的场合（高强度螺栓连接、密封法兰），必须按工艺试验实测。

by_surface:
  general_lubricated:
    name_zh: 一般加工表面 · 有润滑
    K_min: 0.13
    K_max: 0.15
    note: "装配时螺纹与支承面涂润滑脂或二硫化钼"

  general_dry:
    name_zh: 一般加工表面 · 无润滑
    K_min: 0.18
    K_max: 0.21
    note: "最常见的干态装配工况"

  phosphated_hs_bolt:
    name_zh: 磷化高强度螺栓（GB/T 1228~1230 口径）
    K_min: 0.11
    K_max: 0.15
    note: "手册口径，典型取 0.13。钢结构高强度大六角头螺栓连接副"

  phosphated_dry:
    name_zh: 磷化 · 干态（实测口径）
    K_min: 0.18
    K_max: 0.25
    note: "论文实测口径，与上一项冲突，见 _todo。两者差异可能在于是否磷皂化"

  phosphate_soap:
    name_zh: 磷皂化 · 干态
    K_min: 0.13
    K_max: 0.18

  dacromet_dry:
    name_zh: 达克罗 · 干态
    K_min: 0.15
    K_max: 0.25

  zinc_plated_dry:
    name_zh: 镀锌 · 干态
    K_min: 0.25
    K_max: 0.30
    note: "镀锌层摩擦系数高且离散大，力矩法控制预紧力效果最差"

  black_oxide_dry:
    name_zh: 发黑 · 干态
    K_min: 0.25
    K_max: 0.30

# 预紧力推荐值（来源：嘉立创FA 机械设计手册在线版 螺纹连接·预紧力的控制）
#   碳素钢螺栓  F0 = (0.6 ~ 0.7) σs · As
#   合金钢螺栓  F0 = (0.5 ~ 0.6) σs · As
# 本工作流取区间下端（0.6 / 0.5）作为设计预紧力——偏保守。
preload_ratio:
  carbon_steel: {min: 0.6, max: 0.7}
  alloy_steel: {min: 0.5, max: 0.6}
