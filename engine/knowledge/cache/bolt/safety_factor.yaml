# 螺栓连接的安全系数 S
#
# 许用应力 [σ] = σs / S
#
# ── 为什么分"控制 / 不控制预紧力"两档 ──
#
# 不控制预紧力时，预紧力的实际大小取决于装配者的手感，误差可达 ±40%，
# 所以安全系数取得很大，而且**小直径螺栓取得更大**——小螺栓容易被拧过头拧断。
# 控制预紧力（力矩扳手、转角法、测伸长量）后误差收敛，S 可以大幅降低。
#
# ── 直径分档的鸡生蛋问题 ──
#
# S 按直径分档，而直径又要算出 [σ] 之后才知道。工程上的做法是先假定一档、
# 算完再回头核对。本工作流把这个迭代**显式化**：用户先选一个假定档位，
# 末尾有一步校核确认算出的规格确实落在该档内，不落在就提示改档重算。
# 与其把迭代藏在代码里，不如让它出现在计算过程里。

controlled:
  name_zh: 控制预紧力（力矩扳手 / 转角法 / 测伸长量）
  S: 1.5
  range: [1.2, 1.5]
  note: "预紧力可控后误差收敛，S 与直径、材料都无关。本表取 1.5（区间偏保守端）"

uncontrolled:
  name_zh: 不控制预紧力（凭手感拧紧）
  carbon_steel:
    d_le_16:
      S: 4.0
      applies_to: M6 ~ M16
    d_16_to_30:
      S: 3.5
      applies_to: M16 ~ M30
    d_30_to_60:
      S: 3.0
      applies_to: M30 ~ M60
  # 合金钢 + 不控制预紧力：信源只给了笼统的「5.0~5.5」，没有按直径分档。
  # 这里**刻意留空**——选到这个组合，引擎会报出精确缺口，而不是给一个编的数。
  alloy_steel: {}

# 直径分档的边界（供校核步骤使用）
diameter_bands:
  d_le_16: {min: 6, max: 16}
  d_16_to_30: {min: 16, max: 30}
  d_30_to_60: {min: 30, max: 60}
