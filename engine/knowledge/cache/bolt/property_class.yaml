# 螺栓性能等级 —— 公称抗拉强度 Rm 与公称屈服强度 σs
#
# ── 等级代号本身就是数据来源 ──
#
# GB/T 3098.1 规定：代号由小数点隔开的两部分数字组成。
#   点左边  = 公称抗拉强度 Rm 的 1/100（MPa）
#   点右边  = 屈强比 × 10
# 即：  Rm = 左 × 100        σs = Rm × 右 / 10
#
# 例：8.8 → Rm = 800 MPa，屈强比 0.8，σs = 640 MPa。
#
# 所以这张表不是"抄来的一组数"，而是**规则的展开**——
# tests/test_bolt.py 会按上面两式逐行复算校验。
#
# 注：4.8 / 5.8 / 6.8 的屈服值在标准里是规定非比例延伸应力（Rpf / Rp0.2），
# 不是下屈服强度 ReL；工程上同样用于算许用应力，但报告里不要写成"屈服强度"。
#
# ── 键为什么写成 c8_8 而不是 8.8 ──
# 查表路径以点分段（classes.{grade}.sigma_s），键里带点会被拆成两段。
# 真正的等级代号放在 code 字段里，显示与采购关键词都取它。

classes:
  c4_6:
    code: "4.6"
    name_zh: 4.6 级（低碳钢，普通用途）
    Rm: 400
    sigma_s: 240
